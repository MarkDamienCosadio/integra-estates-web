<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f6f3"/>
  
  <!-- Warm background elements -->
  <circle cx="500" cy="100" r="80" fill="#f4e6d7" opacity="0.6"/>
  <circle cx="450" cy="300" r="60" fill="#e8d5c4" opacity="0.4"/>
  
  <!-- Sofa/seating area -->
  <rect x="50" y="280" width="300" height="80" rx="15" fill="#8b4513" opacity="0.7"/>
  <rect x="60" y="270" width="280" height="20" rx="10" fill="#a0522d"/>
  
  <!-- Pillows -->
  <ellipse cx="120" cy="285" rx="25" ry="15" fill="#ffc0cb" opacity="0.8"/>
  <ellipse cx="180" cy="285" rx="25" ry="15" fill="#ffc0cb" opacity="0.6"/>
  
  <!-- Person silhouette -->
  <g transform="translate(200, 150)">
    <!-- Head -->
    <circle cx="0" cy="0" r="25" fill="#d4a574"/>
    <!-- Hair -->
    <path d="M -25 -10 Q -30 -25 -20 -35 Q 0 -40 20 -35 Q 30 -25 25 -10 Q 20 0 15 5 Q 0 8 -15 5 Q -20 0 -25 -10" fill="#8b4513"/>
    <!-- Body -->
    <rect x="-20" y="25" width="40" height="60" rx="8" fill="#ffffff"/>
    <!-- Arms -->
    <rect x="-35" y="35" width="15" height="40" rx="7" fill="#ffffff"/>
    <rect x="20" y="35" width="15" height="40" rx="7" fill="#ffffff"/>
    <!-- Hands -->
    <circle cx="-27" cy="75" r="6" fill="#d4a574"/>
    <circle cx="27" cy="75" r="6" fill="#d4a574"/>
  </g>
  
  <!-- Laptop -->
  <g transform="translate(180, 220)">
    <rect x="0" y="0" width="80" height="50" rx="3" fill="#2c3e50"/>
    <rect x="5" y="5" width="70" height="40" rx="2" fill="#34495e"/>
    <rect x="10" y="10" width="60" height="30" fill="#ecf0f1"/>
    <!-- Screen content lines -->
    <rect x="15" y="15" width="50" height="2" fill="#3498db"/>
    <rect x="15" y="20" width="40" height="2" fill="#95a5a6"/>
    <rect x="15" y="25" width="45" height="2" fill="#95a5a6"/>
  </g>
  
  <!-- Phone -->
  <g transform="translate(160, 200)">
    <rect x="0" y="0" width="25" height="40" rx="5" fill="#2c3e50"/>
    <rect x="3" y="3" width="19" height="34" rx="2" fill="#ecf0f1"/>
    <circle cx="12.5" cy="35" r="2" fill="#3498db"/>
  </g>
  
  <!-- Background elements suggesting home/office -->
  <g transform="translate(400, 50)">
    <!-- Shelves -->
    <rect x="0" y="0" width="150" height="8" fill="#8b4513" opacity="0.6"/>
    <rect x="0" y="40" width="150" height="8" fill="#8b4513" opacity="0.6"/>
    <!-- Books -->
    <rect x="10" y="-15" width="8" height="15" fill="#e74c3c"/>
    <rect x="20" y="-12" width="8" height="12" fill="#3498db"/>
    <rect x="30" y="-18" width="8" height="18" fill="#2ecc71"/>
    <!-- Decorative items -->
    <circle cx="100" cy="-8" r="6" fill="#f39c12"/>
    <rect x="120" y="-10" width="15" height="10" rx="2" fill="#9b59b6"/>
  </g>
  
  <!-- Warm lighting effect -->
  <circle cx="450" cy="80" r="40" fill="#ffd700" opacity="0.3"/>
  
  <!-- Text overlay (subtle) -->
  <text x="300" y="380" font-family="Arial, sans-serif" font-size="14" fill="#666" text-anchor="middle" opacity="0.7">Professional • Connected • Comfortable</text>
</svg>